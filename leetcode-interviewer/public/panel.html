<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LeetCode Interviewer</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1 id="title">Open a LeetCode problem.</h1>
    <p id="meta"></p>
    <div class="controls">
      <button id="start" type="button" disabled>Start interview</button>
      <button id="stop" type="button" hidden>Stop</button>
      <span id="status"></span>
    </div>
  </header>
  <ol id="conversation"></ol>
  <details>
    <summary>Code the interviewer sees</summary>
    <pre id="code"></pre>
  </details>
  <script type="module" src="panel.js"></script>
</body>
</html>
